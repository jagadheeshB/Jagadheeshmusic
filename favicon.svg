<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b8721f"/>
    </linearGradient>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242834"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="#0b0c10"/>
  <circle cx="32" cy="32" r="26" fill="url(#vinylGlow)" stroke="url(#gold)" stroke-width="2"/>
  <!-- Vinyl Grooves -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Golden Initial 'J' -->
  <text x="31" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#gold)" text-anchor="middle">J</text>
  <!-- Studio Amber Light -->
  <circle cx="44" cy="20" r="3" fill="#f59e0b"/>
</svg>
